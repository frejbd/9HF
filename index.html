function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(code){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(IV)},key,fromB64(DATA));
  return new TextDecoder().decode(pt);
}
async function tryOpen(){
  const btn=document.getElementById('go'); btn.disabled=true;
  try{
    const html=await unlock(document.getElementById('code').value);
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('err').textContent='الرمز غير صحيح';
    document.getElementById('code').value=''; btn.disabled=false;
  }
}
document.getElementById('go').addEventListener('click',tryOpen);
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen();});
document.getElementById('code').focus();
</script>
